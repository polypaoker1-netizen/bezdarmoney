<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BezdarMoney Casino</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Шапка -->
        <header>
            <div class="logo">
                <i class="fas fa-coins"></i>
                <h1>BezdarMoney</h1>
            </div>
            <div class="user-info">
                <div class="balance">
                    <i class="fas fa-star"></i>
                    <span id="balance">1000</span> звёзд
                </div>
            </div>
        </header>

        <!-- Основной контент -->
        <main>
            <div class="games-section">
                <div class="games-header">
                    <h2><i class="fas fa-gamepad"></i> Выберите игру</h2>
                    <div class="stats-bar">
                        <div class="stat">
                            <span class="stat-label">Игр:</span>
                            <span id="games-played">0</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Выиграно:</span>
                            <span id="total-wins">0</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Рекорд:</span>
                            <span id="best-win">0</span>
                        </div>
                    </div>
                </div>

                <div class="games-grid">
                    <!-- Рулетка -->
                    <div class="game-card" onclick="openRoulette()">
                        <div class="game-icon roulette-icon">
                            <i class="fas fa-roulette-wheel"></i>
                        </div>
                        <h3>РУЛЕТКА</h3>
                        <p>Красное / Чёрное / Зелёное</p>
                        <div class="game-multiplier">до x36</div>
                    </div>

                    <!-- Слоты -->
                    <div class="game-card" onclick="openSlots()">
                        <div class="game-icon slots-icon">
                            <i class="fas fa-sliders-h"></i>
                        </div>
                        <h3>СЛОТЫ</h3>
                        <p>777 Джекпот</p>
                        <div class="game-multiplier">до x100</div>
                    </div>

                    <!-- Mines -->
                    <div class="game-card" onclick="openMines()">
                        <div class="game-icon mines-icon">
                            <i class="fas fa-gem"></i>
                        </div>
                        <h3>MINES</h3>
                        <p>Найди алмазы</p>
                        <div class="game-multiplier">до x100</div>
                    </div>

                    <!-- Dice -->
                    <div class="game-card" onclick="openDice()">
                        <div class="game-icon dice-icon">
                            <i class="fas fa-dice"></i>
                        </div>
                        <h3>DICE</h3>
                        <p>Угадай число</p>
                        <div class="game-multiplier">до x99</div>
                    </div>

                    <!-- Crash -->
                    <div class="game-card" onclick="openCrash()">
                        <div class="game-icon crash-icon">
                            <i class="fas fa-chart-line"></i>
                        </div>
                        <h3>CRASH</h3>
                        <p>Успей забрать</p>
                        <div class="game-multiplier">до x1000</div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Нижняя навигация -->
        <footer class="bottom-nav">
            <button class="bottom-nav-btn active" onclick="showMainGames()">
                <i class="fas fa-home"></i>
                <span>Игры</span>
            </button>
            <button class="bottom-nav-btn" onclick="window.open('https://t.me/bezdarlfkbf', '_blank')">
                <i class="fab fa-telegram"></i>
                <span>Telegram</span>
            </button>
            <button class="bottom-nav-btn" onclick="openStats()">
                <i class="fas fa-chart-bar"></i>
                <span>Статистика</span>
            </button>
        </footer>
    </div>

    <!-- Модальное окно результата -->
    <div id="resultModal" class="modal">
        <div class="modal-content">
            <div id="resultContent"></div>
            <button onclick="closeModal()">OK</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
