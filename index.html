<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌌 Cosmic Casino | Космическое казино</title>
    <style>
        /* Космические стили */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a2a, #1a1a4a);
            color: #fff;
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Звёзды на фоне */
        #stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Контейнер */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Шапка */
        .header {
            background: rgba(25, 25, 70, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #4a4aff;
            box-shadow: 0 0 30px rgba(74, 74, 255, 0.3);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .balance {
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #000;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        /* Игры */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .game-card {
            background: rgba(30, 30, 80, 0.8);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #4a4aff;
            box-shadow: 0 10px 30px rgba(74, 74, 255, 0.3);
        }

        .game-icon {
            font-size: 48px;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Игровые окна */
        .game-window {
            display: none;
            background: rgba(20, 20, 60, 0.95);
            border-radius: 20px;
            padding: 30px;
            margin-top: 20px;
            border: 2px solid #4a4aff;
            box-shadow: 0 0 50px rgba(74, 74, 255, 0.4);
        }

        .active {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Crash игра */
        #crash-plane {
            width: 100px;
            height: 60px;
            background: linear-gradient(45deg, #3498db, #1e90ff);
            border-radius: 10px;
            margin: 40px auto;
            position: relative;
            transition: transform 0.1s;
        }

        .crash-multiplier {
            font-size: 48px;
            font-weight: bold;
            color: #00ff00;
            text-shadow: 0 0 20px #00ff00;
            margin: 20px 0;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Mines игра */
        .mines-grid {
            display: grid;
            grid-template-columns: repeat(5, 60px);
            gap: 10px;
            justify-content: center;
            margin: 30px 0;
        }

        .mine-cell {
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #2c3e50, #34495e);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid #4a4aff;
        }

        .mine-cell:hover {
            transform: scale(1.05);
            background: linear-gradient(45deg, #3498db, #2980b9);
        }

        .mine-cell.revealed {
            background: linear-gradient(45deg, #27ae60, #2ecc71);
        }

        .mine-cell.mine {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            animation: explode 0.5s;
        }

        @keyframes explode {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Кнопки */
        .btn {
            background: linear-gradient(45deg, #4a4aff, #6c63ff);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(74, 74, 255, 0.4);
        }

        .btn-danger {
            background: linear-gradient(45deg, #ff4757, #ff3838);
        }

        .btn-success {
            background: linear-gradient(45deg, #00b894, #00cec9);
        }

        /* Панель управления */
        .bet-controls {
            background: rgba(40, 40, 90, 0.8);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .bet-input {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #4a4aff;
            border-radius: 10px;
            padding: 15px;
            color: white;
            font-size: 18px;
            width: 200px;
            text-align: center;
        }

        /* Анимации побед/проигрышей */
        .win-animation {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 72px;
            color: #00ff00;
            text-shadow: 0 0 30px #00ff00;
            animation: winPulse 1s;
            z-index: 1000;
        }

        .lose-animation {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 72px;
            color: #ff0000;
            text-shadow: 0 0 30px #ff0000;
            animation: losePulse 1s;
            z-index: 1000;
        }

        @keyframes winPulse {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        @keyframes losePulse {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* Мобильная адаптация */
        @media (max-width: 768px) {
            .games-grid {
                grid-template-columns: 1fr;
            }
            
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .mines-grid {
                grid-template-columns: repeat(5, 50px);
                gap: 5px;
            }
            
            .mine-cell {
                width: 50px;
                height: 50px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <!-- Звёзды на фоне -->
    <div id="stars"></div>

    <div class="container">
        <!-- Шапка -->
        <div class="header">
            <h1>🌌 COSMIC CASINO</h1>
            <div class="user-info">
                <div class="balance">
                    <span id="balance">1000</span> ⭐
                </div>
                <div>
                    <button class="btn" onclick="showSection('deposit')">Пополнить</button>
                    <button class="btn btn-success" onclick="showSection('withdraw')">Вывести</button>
                </div>
            </div>
        </div>

        <!-- Игры -->
        <div class="games-grid">
            <div class="game-card" onclick="startGame('crash')">
                <div class="game-icon">✈️</div>
                <h3>CRASH</h3>
                <p>Самолёт летит и взрывается</p>
            </div>
            
            <div class="game-card" onclick="startGame('mines')">
                <div class="game-icon">💣</div>
                <h3>MINES</h3>
                <p>Найди все драгоценности</p>
            </div>
            
            <div class="game-card" onclick="startGame('roulette')">
                <div class="game-icon">🎡</div>
                <h3>РУЛЕТКА</h3>
                <p>Красное или чёрное</p>
            </div>
            
            <div class="game-card" onclick="startGame('slots')">
                <div class="game-icon">🎰</div>
                <h3>СЛОТЫ</h3>
                <p>5 барабанов</p>
            </div>
            
            <div class="game-card" onclick="startGame('dice')">
                <div class="game-icon">🎲</div>
                <h3>DICE</h3>
                <p>Угадай число</p>
            </div>
        </div>

        <!-- Игровые окна -->
        <div id="crash-game" class="game-window">
            <h2>✈️ CRASH</h2>
            <div class="crash-multiplier" id="crash-multiplier">1.00x</div>
            <div id="crash-plane"></div>
            
            <div class="bet-controls">
                <input type="number" id="crash-bet" class="bet-input" placeholder="Ставка" min="10" value="100">
                <button class="btn btn-success" onclick="placeCrashBet()">Поставить</button>
                <button class="btn" id="cashout-btn" onclick="cashOut()" disabled>Забрать</button>
                <button class="btn btn-danger" onclick="showSection('games')">Назад</button>
            </div>
        </div>

        <div id="mines-game" class="game-window">
            <h2>💣 MINES</h2>
            <p>Сделано ходов: <span id="moves-count">0</span></p>
            <div class="mines-grid" id="mines-grid"></div>
            
            <div class="bet-controls">
                <input type="number" id="mines-bet" class="bet-input" placeholder="Ставка" min="10" value="100">
                <button class="btn btn-success" onclick="startMinesGame()">Начать игру</button>
                <button class="btn btn-danger" onclick="showSection('games')">Назад</button>
            </div>
        </div>
    </div>

    <script>
        // Звёзды на фоне
        function createStars() {
            const stars = document.getElementById('stars');
            for (let i = 0; i < 150; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                stars.appendChild(star);
            }
        }

        // Переключение секций
        function showSection(section) {
            // Скрыть все игровые окна
            document.querySelectorAll('.game-window').forEach(el => {
                el.classList.remove('active');
            });
            
            if (section === 'games') {
                // Показать только сетку игр
                document.querySelector('.games-grid').style.display = 'grid';
            } else if (section === 'crash') {
                document.getElementById('crash-game').classList.add('active');
                document.querySelector('.games-grid').style.display = 'none';
            } else if (section === 'mines') {
                document.getElementById('mines-game').classList.add('active');
                document.querySelector('.games-grid').style.display = 'none';
            }
        }

        // CRASH игра
        let crashInterval;
        let crashMultiplier = 1.0;
        let crashBetAmount = 0;
        let crashActive = false;

        function placeCrashBet() {
            const betInput = document.getElementById('crash-bet');
            const bet = parseInt(betInput.value);
            const balance = parseInt(document.getElementById('balance').innerText);
            
            if (bet < 10) {
                alert('Минимальная ставка: 10⭐');
                return;
            }
            
            if (bet > balance) {
                alert('Недостаточно средств');
                return;
            }
            
            crashBetAmount = bet;
            updateBalance(-bet);
            
            // Запуск игры
            crashMultiplier = 1.0;
            crashActive = true;
            document.getElementById('cashout-btn').disabled = false;
            
            // Анимация самолёта
            const plane = document.getElementById('crash-plane');
            plane.style.transform = 'translateY(0)';
            
            // Рандомный момент взрыва (1.2x - 10x)
            const crashPoint = 1.2 + Math.random() * 8.8;
            
            crashInterval = setInterval(() => {
                if (!crashActive) return;
                
                crashMultiplier += 0.01;
                document.getElementById('crash-multiplier').innerText = crashMultiplier.toFixed(2) + 'x';
                plane.style.transform = `translateY(-${(crashMultiplier - 1) * 20}px)`;
                
                // Проверка на взрыв
                if (crashMultiplier >= crashPoint) {
                    crashExplode();
                }
            }, 100);
        }

        function cashOut() {
            if (!crashActive) return;
            
            crashActive = false;
            clearInterval(crashInterval);
            
            const winAmount = Math.floor(crashBetAmount * crashMultiplier);
            updateBalance(winAmount);
            
            showWinAnimation(`+${winAmount}⭐`);
            document.getElementById('cashout-btn').disabled = true;
            
            // Отправить статистику на сервер
            sendGameResult('crash', crashBetAmount, crashMultiplier, winAmount - crashBetAmount);
        }

        function crashExplode() {
            crashActive = false;
            clearInterval(crashInterval);
            
            const plane = document.getElementById('crash-plane');
            plane.style.background = 'linear-gradient(45deg, #ff0000, #ff6b6b)';
            plane.style.transform += ' rotate(45deg) scale(1.2)';
            
            showLoseAnimation('ВЗРЫВ!');
            document.getElementById('cashout-btn').disabled = true;
            
            // Отправить статистику на сервер
            sendGameResult('crash', crashBetAmount, crashMultiplier, -crashBetAmount);
            
            // Сброс через 2 секунды
            setTimeout(() => {
                plane.style.background = 'linear-gradient(45deg, #3498db, #1e90ff)';
                plane.style.transform = 'translateY(0) rotate(0) scale(1)';
            }, 2000);
        }

        // MINES игра
        let minesBetAmount = 0;
        let minesStep = 0;
        let minesGrid = [];

        function startMinesGame() {
            const betInput = document.getElementById('mines-bet');
            const bet = parseInt(betInput.value);
            const balance = parseInt(document.getElementById('balance').innerText);
            
            if (bet < 10) {
                alert('Минимальная ставка: 10⭐');
                return;
            }
            
            if (bet > balance) {
                alert('Недостаточно средств');
                return;
            }
            
            minesBetAmount = bet;
            updateBalance(-bet);
            minesStep = 0;
            document.getElementById('moves-count').innerText = '0';
            
            // Создание сетки 5x5
            const grid = document.getElementById('mines-grid');
            grid.innerHTML = '';
            minesGrid = [];
            
            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.classList.add('mine-cell');
                cell.dataset.index = i;
                cell.addEventListener('click', () => revealMine(i));
                grid.appendChild(cell);
                minesGrid.push({
                    isMine: false,
                    revealed: false
                });
            }
        }

        function revealMine(index) {
            if (minesGrid[index].revealed) return;
            
            minesStep++;
            document.getElementById('moves-count').innerText = minesStep;
            
            const cell = document.querySelector(`.mine-cell[data-index="${index}"]`);
            
            // Логика: на 3 или 4 шаге обязательно мина
            let isMine = false;
            if (minesStep === 3 || minesStep === 4) {
                isMine = Math.random() < 0.5; // 50% шанс на мину
                if (minesStep === 4 && !minesGrid.some(m => m.isMine)) {
                    isMine = true; // Если на 3 шаге не было мины, на 4 обязательно
                }
            } else {
                isMine = Math.random() < 0.15; // 15% шанс в других случаях
            }
            
            minesGrid[index].isMine = isMine;
            minesGrid[index].revealed = true;
            
            if (isMine) {
                cell.classList.add('mine');
                cell.innerHTML = '💣';
                
                showLoseAnimation('МИНА!');
                sendGameResult('mines', minesBetAmount, 0, -minesBetAmount);
            } else {
                cell.classList.add('revealed');
                cell.innerHTML = '💎';
                
                // Выигрыш за камень
                const winAmount = Math.floor(minesBetAmount * 1.5);
                updateBalance(winAmount);
                
                // Проверка на победу (все камни найдены)
                const remainingCells = minesGrid.filter(cell => !cell.revealed);
                if (remainingCells.length === 0 || remainingCells.every(c => c.isMine)) {
                    const totalWin = Math.floor(minesBetAmount * 2.5);
                    updateBalance(totalWin);
                    showWinAnimation(`ПОБЕДА! +${totalWin}⭐`);
                    sendGameResult('mines', minesBetAmount, 2.5, totalWin);
                }
            }
        }

        // Управление балансом
        function updateBalance(amount) {
            const balanceEl = document.getElementById('balance');
            let balance = parseInt(balanceEl.innerText);
            balance += amount;
            balanceEl.innerText = balance;
            
            // Сохранить в localStorage
            localStorage.setItem('casinoBalance', balance);
        }

        // Анимации
        function showWinAnimation(text) {
            const anim = document.createElement('div');
            anim.className = 'win-animation';
            anim.innerText = text;
            document.body.appendChild(anim);
            
            setTimeout(() => anim.remove(), 2000);
        }

        function showLoseAnimation(text) {
            const anim = document.createElement('div');
            anim.className = 'lose-animation';
            anim.innerText = text;
            document.body.appendChild(anim);
            
            setTimeout(() => anim.remove(), 2000);
        }

        // Отправка результатов на сервер
        function sendGameResult(game, bet, multiplier, profit) {
            fetch('/game-result', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    game: game,
                    bet: bet,
                    multiplier: multiplier,
                    profit: profit,
                    userId: localStorage.getItem('userId') || 'anonymous'
                })
            });
        }

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            createStars();
            
            // Загрузить баланс из localStorage
            const savedBalance = localStorage.getItem('casinoBalance');
            if (savedBalance) {
                document.getElementById('balance').innerText = savedBalance;
            }
            
            // Генерация ID пользователя
            if (!localStorage.getItem('userId')) {
                localStorage.setItem('userId', 'user_' + Math.random().toString(36).substr(2, 9));
            }
        });

        // Функции для других игр (рулетка, слоты, кости)
        function startGame(game) {
            showSection(game);
            
            if (game === 'roulette') {
                // TODO: Реализация рулетки
                alert('Рулетка в разработке');
            } else if (game === 'slots') {
                // TODO: Реализация слотов
                alert('Слоты в разработке');
            } else if (game === 'dice') {
                // TODO: Реализация костей
                alert('Кости в разработке');
            }
        }
    </script>
</body>
</html>
